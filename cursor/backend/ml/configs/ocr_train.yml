
Global:
  debug: false
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/ocr_lenta
  save_epoch_step: 10
  eval_batch_step: [0, 200]
  cal_metric_during_train: true
  pretrained_model: ./models/pretrained/ch_PP-OCRv4_rec_train/best_accuracy.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/en/word_1.png
  character_dict_path: ./dict/lenta_dict.txt
  max_text_length: 50
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_ppocrv3.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetNew
    scale: 0.95
  Head:
    name: MultiHead
    out_channels_list:
      CTCLabelDecode: 80
      SARLabelDecode: 128
    # SAR Head
    attention:
      mode: stream
      dim: 128
      hidden_size: 128
      attention_mode: pcurrence_wn_generic_att
    # CTC Head
    fc_decay: 0.0004
  Neck:
    name: svtr
    dims: 120
    depth: 2
    hidden_dims: 120
    use_guide: True

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
        use_focal_loss: false
        weight: 1.0
        mask_others: false
    - SARLoss:
        weight: 1.0
        mask_others: false

PostProcess:
  name: CTCLabelDecode
  SARLabelDecode:

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/paddleocr_format/train
    ext_op_transform_idx: 1
    label_file_list: ["./data/paddleocr_format/train/labels.txt"]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape: [48, 320, 3]
          max_text_length: 50
      - RecAug:
      - CTCLabelEncode:
      - SVTRRecResizeImg:
          image_shape: [3, 48, 320]
          padding: False
      - KeepKeys:
          keep_keys: ["image", "label", "length"]
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/paddleocr_format/val
    label_file_list: ["./data/paddleocr_format/val/labels.txt"]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - SVTRRecResizeImg:
          image_shape: [3, 48, 320]
          padding: False
      - KeepKeys:
          keep_keys: ["image", "label", "length"]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4
